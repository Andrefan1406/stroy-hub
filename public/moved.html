<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Сервис переехал</title>
  <!-- Показывается на старом адресе branch deploy ветки
       feature/ride-request-system (см. public/_redirects) вместо сайта. -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: #f4f6f8;
      color: #1f2933;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 20px; line-height: 1.5; }
    .url { word-break: break-all; font-weight: 600; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      background: #1565c0;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
    }
    .hint { margin: 20px 0 0; font-size: 14px; color: #616e7c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Сервис переехал</h1>
    <p>Этот адрес больше не используется. Портал теперь доступен по новой ссылке:</p>
    <p class="url">https://vkdevelopment.netlify.app</p>
    <a class="btn" id="go" href="https://vkdevelopment.netlify.app/">Перейти на новый адрес</a>
    <p class="hint">Обновите закладку. Логин и пароль — прежние.</p>
  </div>
  <script>
    // Ведём на ту же страницу нового адреса (/employee, /dispatcher и т.д.).
    document.getElementById('go').href = 'https://vkdevelopment.netlify.app' + location.pathname + location.search;
  </script>
</body>
</html>
